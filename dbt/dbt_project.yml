name: ecommerce_data_platform
profile: dbt

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_data_platform:
    +static_analysis: strict
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  ecommerce_data_platform:
    +schema: reference    
version: 2

models:
  - name: int_olist__geolocation_aggregated
    description: One row per zip_code. Removes exact duplicate coordinate rows and averages latitude and longitude. City and state excluded due to source data quality.
    columns:
      - name: zip_code
        description: 5-digit Brazilian zip code prefix. Kept as VARCHAR to preserve leading zeros.
        data_tests:
          - unique
          - not_null
      - name: latitude
        description: Average latitude of all distinct coordinate points for the zip code. Cast to NUMBER(8,6).
        data_tests:
          - not_null
      - name: longitude
        description: Average longitude of all distinct coordinate points for the zip code. Cast to NUMBER(9,6).
        data_tests:
          - not_null

  - name: int_olist__customers_enriched
    description: Deduplicated customers with standardised city and state, and geolocation coordinates joined on zip code.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_city
        description: Standardised city from location_standardization, falling back to original value if no match.
        data_tests:
          - not_null
      - name: customer_state
        description: Standardised state from location_standardization, falling back to original value if no match.
        data_tests:
          - not_null
      - name: latitude
        description: Centroid latitude for the customer zip code from int_olist__geolocation_aggregated.
      - name: longitude
        description: Centroid longitude for the customer zip code from int_olist__geolocation_aggregated.

  - name: int_olist__sellers_enriched
    description: Deduplicated sellers with standardised city and state, and geolocation coordinates joined on zip code.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: seller_city
        description: Standardised city from location_standardization, falling back to original value if no match.
        data_tests:
          - not_null
      - name: seller_state
        description: Standardised state from location_standardization, falling back to original value if no match.
        data_tests:
          - not_null
      - name: latitude
        description: Centroid latitude for the seller zip code from int_olist__geolocation_aggregated.
      - name: longitude
        description: Centroid longitude for the seller zip code from int_olist__geolocation_aggregated.

  - name: int_olist__order_reviews_enriched
    description: Deduplicated order reviews enriched with sentiment classification, response time and message presence flag.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - review_id
    columns:
      - name: review_sentiment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: has_message
        data_tests:
          - not_null

  - name: int_olist__order_reviews_aggregated
    description: One row per order aggregating review scores, sentiment, response time and engagement metrics.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: review_count
        data_tests:
          - not_null
      - name: avg_review_score
        data_tests:
          - not_null
      - name: overall_sentiment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
      - name: has_multiple_reviews
        data_tests:
          - not_null

  - name: int_olist__order_payments_aggregated
    description: One row per order aggregating payment methods, values, installments and payment type flags.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: total_payment_value
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "primary_payment_type <> 'not_defined'" 
      - name: number_of_payment_types
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: has_split_payment
        data_tests:
          - not_null
      - name: primary_payment_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: used_credit_card
        data_tests:
          - not_null
      - name: used_voucher
        data_tests:
          - not_null

  - name: int_olist__products_enriched
    description: Deduplicated products with English category name joined from the translation table.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category
        description: English product category name translated from Portuguese.

  - name: int_olist__order_items_enriched
    description: Order items enriched with product category and dimensions, seller location and derived price metrics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: freight_value
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: total_item_value
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: int_olist__orders_enriched
    description: Orders enriched with customer location, delivery time metrics, payment summary and review sentiment.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'processing', 'invoiced', 'created', 'approved']
      - name: order_purchased_at
        data_tests:
          - not_null
      - name: primary_payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: overall_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
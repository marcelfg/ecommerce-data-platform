version: 2

models:
  - name: dim_customers
    description: Customer dimension at customer_unique_id grain with RFM-style lifetime metrics derived from order history.
    columns:
      - name: customer_unique_id
        data_tests:
          - unique
          - not_null
      - name: first_purchase_date
        data_tests:
          - not_null
      - name: latest_purchase_date
        data_tests:
          - not_null
      - name: customer_lifespan_days
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: lifetime_revenue
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn
      - name: lifetime_order_count
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: average_order_value
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn
      - name: is_repeat_customer
        data_tests:
          - not_null
      - name: preferred_payment_type
        description: Most frequent primary_payment_type across the customer's orders. Reflects the dominant payment method per order, not every method used in split payments.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: dim_sellers
    description: Seller dimension at seller_id grain with stable location attributes.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code
        data_tests:
          - not_null
      - name: seller_city
        data_tests:
          - not_null
      - name: seller_state
        data_tests:
          - not_null

  - name: dim_products
    description: Product dimension at product_id grain with category, listing quality attributes and physical dimensions.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: listing_photo_count
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "listing_photo_count IS NOT NULL"
      - name: weight_g
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "weight_g IS NOT NULL"
                severity: warn
      - name: product_volume_cm3
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "product_volume_cm3 IS NOT NULL"

  - name: fct_orders
    description: Order-level fact table combining order status, delivery timing, item totals, payment summary and review sentiment.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'processing', 'invoiced', 'created', 'approved']
      - name: order_purchased_at
        data_tests:
          - not_null
      - name: item_count
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
              config:
                where: "item_count IS NOT NULL"
      - name: total_price
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "total_price IS NOT NULL"
      - name: total_payment_value
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "primary_payment_type <> 'not_defined' AND total_payment_value IS NOT NULL"
      - name: primary_payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: discount_rate
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "BETWEEN 0 AND 1"
              config:
                where: "discount_rate IS NOT NULL"
      - name: overall_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
version: 2

models:
  - name: stg_olist__customers
    description: Cleaned and renamed customer data from the Olist raw layer.
    columns:
      - name: customer_id
        description: Unique identifier for each order-level customer record.
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identifier that ties multiple orders back to the same physical customer.
        tests:
          - not_null
      - name: zip_code
        description: 5-digit zip code prefix of the customer. Kept as VARCHAR to preserve leading zeros.
        tests:
          - not_null
      - name: city
        description: Customer city in lowercase with surrounding whitespace removed.
        tests:
          - not_null
      - name: state
        description: Customer state as a 2-letter uppercase abbreviation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null

  - name: stg_olist__geolocation
    description: Cleaned and renamed geolocation data from the Olist raw layer.
    columns:
      - name: zip_code
        description: 5-digit Brazilian zip code prefix. Not unique — multiple coordinate points exist per prefix. Kept as VARCHAR to preserve leading zeros.
        tests:
          - not_null
      - name: latitude
        description: Latitude of the coordinate point. Cast to NUMBER(8,6).
        tests:
          - not_null
      - name: longitude
        description: Longitude of the coordinate point. Cast to NUMBER(9,6).
        tests:
          - not_null
      - name: city
        description: City name in lowercase with surrounding whitespace removed.
        tests:
          - not_null
      - name: state
        description: Brazilian state as a 2-letter uppercase abbreviation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null

  - name: stg_olist__products
    description: Cleaned and renamed product catalogue data from the Olist raw layer.
    columns:
      - name: product_id
        description: Unique identifier for each product.
        tests:
          - unique
          - not_null
      - name: category_name
        description: Product category in Portuguese.
      - name: name_length
        description: Character count of the product name. Renamed from product_name_lenght.
      - name: description_length
        description: Character count of the product description. Renamed from product_description_lenght.
      - name: photos_qty
        description: Number of product photos.
      - name: weight_g
        description: Product weight in grams.
      - name: length_cm
        description: Product length in centimetres.
      - name: height_cm
        description: Product height in centimetres.
      - name: width_cm
        description: Product width in centimetres.
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null

  - name: stg_olist__sellers
    description: Cleaned and renamed seller data from the Olist raw layer.
    columns:
      - name: seller_id
        description: Unique identifier for each seller.
        tests:
          - unique
          - not_null
      - name: zip_code
        description: 5-digit zip code prefix of the seller. Kept as VARCHAR to preserve leading zeros.
        tests:
          - not_null
      - name: city
        description: Seller city in lowercase with surrounding whitespace removed.
        tests:
          - not_null
      - name: state
        description: Seller state as a 2-letter uppercase abbreviation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null

  - name: stg_olist__orders
    description: Cleaned and renamed order data from the Olist raw layer.
    columns:
      - name: order_id
        description: Unique identifier for each order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier linking the order to a customer record.
        tests:
          - not_null
      - name: status
        description: Current status of the order.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered','shipped','canceled','unavailable','invoiced','processing','created','approved']
      - name: purchase_at
        description: Timestamp when the order was placed.
        tests:
          - not_null
      - name: approved_at
        description: Timestamp when the order was approved. Null for unapproved orders.
      - name: delivered_carrier_at
        description: Timestamp when the order was handed to the carrier. Renamed from order_delivered_carrier_date.
      - name: delivered_customer_at
        description: Timestamp when the order was delivered to the customer. Renamed from order_delivered_customer_date.
      - name: estimated_delivery_at
        description: Estimated delivery timestamp at time of purchase. Renamed from order_estimated_delivery_date.
        tests:
          - not_null
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null
version: 2

models:
  - name: stg_olist__customers
    description: Cleaned and renamed customer data from the Olist raw layer.
    columns:
      - name: customer_id
        description: Unique identifier for each order-level customer record.
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identifier that ties multiple orders back to the same physical customer.
        tests:
          - not_null
      - name: zip_code
        description: 5-digit zip code prefix of the customer. Kept as VARCHAR to preserve leading zeros.
        tests:
          - not_null
      - name: city
        description: Customer city in lowercase with surrounding whitespace removed.
        tests:
          - not_null
      - name: state
        description: Customer state as a 2-letter uppercase abbreviation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null

  - name: stg_olist__geolocation
    description: >
      Cleaned and renamed geolocation data from the Olist raw layer.
      Each row maps a Brazilian zip code prefix to a lat/lng coordinate point.
      Zip codes intentionally appear on multiple rows — each prefix covers a geographic
      area and may have many coordinate points. Exact duplicates (26% of rows) and
      42 out-of-bounds coordinates are preserved from the source; deduplication and
      coordinate filtering belong in downstream intermediate models.
    columns:
      - name: zip_code
        description: 5-digit Brazilian zip code prefix. Not unique — multiple coordinate points exist per prefix. Kept as VARCHAR to preserve leading zeros.
        tests:
          - not_null
      - name: latitude
        description: Latitude of the coordinate point. Cast to NUMBER(8,6). A NULL indicates a source value that could not be cast to a number. Note — 42 rows contain geometrically valid numbers that fall outside Brazil's bounding box (geocoding errors in the source).
        tests:
          - not_null
      - name: longitude
        description: Longitude of the coordinate point. Cast to NUMBER(9,6). A NULL indicates a source value that could not be cast to a number. Note — 42 rows contain geometrically valid numbers that fall outside Brazil's bounding box (geocoding errors in the source).
        tests:
          - not_null
      - name: city
        description: City name in lowercase with surrounding whitespace removed. May contain accented characters, encoding artefacts, or abbreviations inherited from the source.
        tests:
          - not_null
      - name: state
        description: Brazilian state as a 2-letter uppercase abbreviation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO']
      - name: _loaded_at
        description: Timestamp when the record was loaded into Snowflake from S3.
        tests:
          - not_null